<title>고공강하 480 시안</title>
<style>body{margin:0;background:#111}canvas{display:block;image-rendering:pixelated}</style>
<canvas id="cv" width="480" height="480"></canvas>
<script>
/* 고공강하 컷 480×480 시안. 게임 컷(240)과 같은 장면을 픽셀 밀도 4배로 그린다.
   ?t=프레임 (12fps 기준). 20 = 자유낙하, 64 = 낙하산 전개 */
const T=+(new URLSearchParams(location.search).get('t')||20);
const c=document.getElementById('cv').getContext('2d');const W=480,H=480;
const r=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)));};
const circ=(x,y,rad,col)=>{c.fillStyle=col;c.beginPath();c.arc(x,y,rad,0,Math.PI*2);c.fill();};
const open=T>48;

/* 하늘: 성층권 → 대류권, 띠 경계는 체커 디더링으로 레트로 질감 */
const bands=['#020617','#071232','#0E1E4E','#1B2F6E','#2E4A8E','#4A6AAE','#6E8FC8','#94B0DA'];
const bh=H/bands.length;
bands.forEach((col,i)=>{r(0,i*bh,W,bh,col);if(i){for(let x=0;x<W;x+=2)for(let y=0;y<6;y+=2){r(x+(y%4?1:0),i*bh-3+y,1,1,bands[i-1]);}}});
for(let i=0;i<90;i++){const x=(i*97)%W,y=(i*61)%150,tw=(T+i)%20<3;r(x,y,tw?2:1,tw?2:1,i%7?'rgba(255,255,255,.7)':'#FFF7D6');}
/* 지평선 대기광 */
const hz=open?300:380;const g=c.createLinearGradient(0,hz-30,0,hz+10);g.addColorStop(0,'rgba(140,210,255,0)');g.addColorStop(1,'rgba(160,220,255,.45)');
c.fillStyle=g;c.beginPath();c.ellipse(240,hz+600,900,620,0,Math.PI,0);c.fill();

/* 땅 (전개 후에만 보임): 논밭 조각, 강, 길, 마을 */
if(open){
  const top=330;r(0,top,W,H-top,'#4E6B3A');
  const fields=['#5D7A42','#6B8A4A','#8AA05C','#4A6534','#A3A86A','#5A7040'];
  for(let j=0;j<8;j++)for(let i=0;i<12;i++){const w=40+((i*j*13)%20),x=i*42+(j%2)*18,y=top+j*20;r(x,y,w,18,fields[(i+j*3)%fields.length]);r(x,y+17,w,1,'rgba(0,0,0,.12)');}
  c.strokeStyle='#5B8FC9';c.lineWidth=7;c.beginPath();c.moveTo(-10,350);for(let x=0;x<=W+20;x+=20)c.lineTo(x,350+Math.sin(x/60)*22+x*0.18);c.stroke();
  c.strokeStyle='#9FC7EC';c.lineWidth=2;c.stroke();
  c.strokeStyle='#D8CDB0';c.lineWidth=3;c.beginPath();c.moveTo(80,H);c.lineTo(210,top);c.stroke();
  for(let i=0;i<14;i++){const x=300+(i*23)%120,y=400+(i*17)%50;r(x,y,8,6,i%3?'#D9D2C2':'#B8432E');r(x,y+6,8,2,'#6E6A60');}
}

/* 구름: 세 겹 시차, 덩어리마다 윗면 밝게 아랫면 그림자 */
function cloud(cx,cy,s,a){
  const puffs=[[0,0,1],[-.9,.25,.75],[.9,.2,.8],[-.4,-.35,.7],[.45,-.3,.65],[1.6,.4,.5],[-1.6,.45,.5]];
  for(const [dx,dy,k] of puffs)circ(cx+dx*s,cy+dy*s+s*.18,k*s*.62,`rgba(120,140,175,${a})`);
  for(const [dx,dy,k] of puffs)circ(cx+dx*s,cy+dy*s,k*s*.6,`rgba(236,242,252,${a})`);
  for(const [dx,dy,k] of puffs)circ(cx+dx*s-k*s*.12,cy+dy*s-k*s*.18,k*s*.32,`rgba(255,255,255,${a})`);
}
const sp=open?.8:3.2;
[[34,.55,.5],[46,.75,.8],[60,1,1.2]].forEach(([s,a,par],L)=>{for(let i=0;i<5;i++){const y=(((i*157+L*90)-T*sp*par*2)%620+620)%620-70,x=((i*131+L*70)%560)-40;if(!open||y<300)cloud(x,y,s,a);}});

/* 수송기 (자유낙하 초반) */
if(!open&&T<30){
  const px=60-T*5,py=48-T*2;
  c.save();c.translate(px,py);
  r(0,20,190,30,'#5C636E');r(190,26,40,18,'#4A5059');r(10,14,170,8,'#6A727E');
  r(30,6,140,8,'#4A5059');for(const ex of [42,74,118,150]){r(ex,0,10,10,'#3A3F47');if(T%2)r(ex-6,4,22,2,'#222');else r(ex+3,-6,2,22,'#222');}
  r(-20,22,24,22,'#4A5059');r(-30,8,18,18,'#4A5059');
  r(182,44,46,8,'#2E3238');c.fillStyle='rgba(255,60,40,.55)';c.fillRect(186,30,30,12);
  r(0,50,190,2,'rgba(0,0,0,.3)');c.restore();
  c.fillStyle='rgba(255,255,255,.18)';for(let i=0;i<4;i++)c.fillRect(px-200,py+4+i*8,200,2);
}

/* 강하자 */
const jx=230+Math.sin(T/9)*20,jy=open?236:Math.min(240,60+T*8);
if(!open){
  c.save();c.translate(jx,jy);c.rotate(Math.sin(T/7)*.08);
  r(-30,-6,60,14,'#4E5A2A');r(-22,-4,44,3,'#5E6B35');
  r(-46,-2,18,6,'#4E5A2A');r(28,-2,18,6,'#4E5A2A');r(-52,-3,7,7,'#2A2620');r(45,-3,7,7,'#2A2620');
  r(-28,8,10,22,'#4E5A2A');r(18,8,10,22,'#4E5A2A');r(-29,28,12,6,'#1A1712');r(17,28,12,6,'#1A1712');
  r(-12,-16,24,12,'#3C4520');r(-10,10,20,12,'#5A4A30');
  r(30,-12,16,14,'#2E3238');r(34,-8,8,6,'#8FD3FF');r(36,-7,3,2,'#FFFFFF');
  r(40,2,6,4,'#1A1A1A');c.strokeStyle='#1A1A1A';c.lineWidth=2;c.beginPath();c.moveTo(42,4);c.quadraticCurveTo(30,14,6,6);c.stroke();
  r(-40,4,6,4,'#C9C9C9');
  c.restore();
}else{
  const k=Math.min(1,(T-48)/8);const cw=150*k+20,ch=30*k+6,cy=jy-130;
  for(let i=0;i<7;i++){const x=jx-cw/2+i*cw/7;r(x,cy,cw/7+1,ch,i%2?'#4E5A2A':'#5E6B35');r(x,cy,cw/7+1,4,'#6E7B45');r(x,cy+ch-3,cw/7+1,3,'#3C4520');}
  c.beginPath();c.moveTo(jx-cw/2,cy+ch);c.quadraticCurveTo(jx,cy-14,jx+cw/2,cy+ch);c.lineTo(jx+cw/2,cy+ch-2);c.fillStyle='rgba(0,0,0,0)';c.fill();
  c.strokeStyle='rgba(30,30,30,.75)';c.lineWidth=1;for(let i=0;i<=8;i++){c.beginPath();c.moveTo(jx-cw/2+i*cw/8,cy+ch);c.lineTo(jx+(i<4?-6:6),jy-10);c.stroke();}
  r(jx-10,jy-16,20,16,'#2E3238');r(jx-6,jy-12,10,5,'#8FD3FF');
  r(jx-12,jy,24,30,'#4E5A2A');r(jx-16,jy+2,6,16,'#4E5A2A');r(jx+10,jy+2,6,16,'#4E5A2A');
  r(jx-10,jy+30,8,24,'#3C4520');r(jx+2,jy+30,8,24,'#3C4520');r(jx-11,jy+52,10,5,'#1A1712');r(jx+1,jy+52,10,5,'#1A1712');
  c.strokeStyle='#2A2620';c.lineWidth=1;c.beginPath();c.moveTo(jx,jy+30);c.lineTo(jx+4,jy+80);c.stroke();r(jx-8,jy+80,24,18,'#5A4A30');r(jx-6,jy+82,20,3,'#6B5A3A');
}
</script>
